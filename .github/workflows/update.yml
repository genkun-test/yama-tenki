name: update-plan
on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 最新の計画URLを受け取って作り直す
        env:
          PLAN_SRC: ${{ secrets.PLAN_SRC }}
        run: |
          if [ -z "$PLAN_SRC" ]; then echo "PLAN_SRC が未設定"; exit 0; fi
          URL=$(curl -sL --max-time 60 "$PLAN_SRC" | tr -d '\r\n ')
          if ! echo "$URL" | grep -Eq '^https://yamap\.com/plans/code/[A-Za-z0-9_-]+$'; then echo "計画URLが取れなかった"; exit 0; fi
          echo "::add-mask::$URL"
          # 取れなかった回は今のページを残して、次の時間にもう一度
          if ! python3 build.py "$URL" > /dev/null; then
            echo "::warning::YAMAP から計画を取れなかった（次の時間に再試行）"
            # 今のページと別の計画なら、前の計画のままだとページに出す（同じ計画の一時的な失敗なら何もしない）
            NEW_ID=$(printf '%s' "$URL" | sha256sum | cut -c1-16)
            if [ "$NEW_ID" != "$(cat docs/plan-id.txt 2>/dev/null)" ]; then python3 build.py --stale; fi
          fi
          if git diff --quiet -- docs; then echo "変更なし"; exit 0; fi
          git config user.name "yama-tenki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs && git commit -qm "計画を更新" && git push -q
