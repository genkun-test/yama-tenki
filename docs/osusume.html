:root{--bg:#eef3f1;--card:#fff;--ink:#1d2b2a;--sub:#5b6d6a;--line:#d5dfdc;--acc:#1f6f5c;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;font-size:17px;line-height:1.5}

#list{margin:8px 16px;display:flex;flex-direction:column;gap:8px}

.mt .note{font-size:14px;color:var(--bad)}
.strip{display:flex;gap:2px;margin-top:6px}
.strip i{flex:1;height:22px;border-radius:4px;background:var(--line);font-style:normal;font-size:11px;text-align:center;line-height:22px;color:#fff}
.strip i.ok{background:var(--ok)}.strip i.warn{background:var(--warn)}.strip i.bad{background:var(--bad)}
.strip i.we{outline:2px solid var(--ink);outline-offset:-2px}
#done{margin:4px 16px 28px;font-size:14px;color:var(--sub);line-height:1.9}
#done span{display:inline-block;margin-right:10px;white-space:nowrap}
.legend{margin:0 16px;font-size:13px;color:var(--sub)}
</style>

function plan(m,w){
  const hrs=m.course.sec/3600,nd=w.time.length/24,multi=hrs>10,need=multi?Math.ceil(hrs/8):1,len=Math.ceil(hrs);

        best=`${f===0?'今日':f===1?'あす':(t.getMonth()+1)+'/'+t.getDate()}（${WK[t.getDay()]}）`+(p.multi?`から${p.need}日間がよさそう`:`${s}時〜${s+Math.ceil(p.hrs)}時がよさそう`)}
      else{cls=p.lv.some(x=>x===1)?'warn':'bad';best='16日先まで、おだやかな日が見当たりません'}
      strip='<div class="strip">'+p.lv.map((x,j)=>{const t=new Date(+today+j*864e5),we=t.getDay()%6===0;return `<i class="${x>=0?LV[x]:''}${we?' we':''}">${t.getDate()}</i>`}).join('')+'</div>'}
    const c=m.course,quiet=m.season&&m.season[mon]<2;
    const far=d!=null?`　ここから約${Math.round(d)}km（車で${hm(d*1.4/45)}ほど・目安）`:'';
    return `<a class="mt ${cls}" href="https://yamap.com/mountains/${m.id}" target="_blank" rel="noopener">
      ${m.img?`<img class="ph" src="${m.img}" alt="" loading="lazy" width="540" height="360" onerror="this.remove()">`:''}
      <div class="nm">${m.name} <small>${m.alt}m　${m.pref.join('・')}</small></div>
      <div class="best">${best}</div>
      <div class="vals">${p&&p.multi?'⛺ ':''}歩く時間 ${hm(c.sec/3600)}　${c.km}km　登り${c.up}m${far}</div>
      <div class="vals">${c.name}</div>
      ${quiet?'<div class="note">この月に登る人は少ない山です（雪や通行止めに注意）</div>':''}${strip}</a>`}).join('');
  $('done').innerHTML=DONE.sort((a,b)=>b.climbed-a.climbed).map(m=>`<span>${m.name}${m.climbed>1?' ×'+m.climbed:''}</span>`).join('');
}
function stamp(t,off){const d=new Date(t);$('stamp').className=off?'off':'';
  $('stamp').textContent=(off?'電波なし。':'')+`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())} に取った予報`+(off?'を表示中':'')+`（山の一覧は ${BUILT} 更新）`}
async function load(){
  const key='osusume:'+NEW.map(m=>m.id).join(',');
  let saved=null;try{saved=JSON.parse(localStorage.getItem('osusume'));if(saved.k!==key)saved=null}catch(e){saved=null}
  if(saved){WX=saved.d;stamp(saved.t,false);render()}
  if(!NEW.length)return;
  const q='https://api.open-meteo.com/v1/forecast?latitude='+NEW.map(m=>m.lat)+'&longitude='+NEW.map(m=>m.lon)+'&elevation='+NEW.map(m=>m.alt)+
    '&hourly=apparent_temperature,weather_code,precipitation,wind_speed_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=16';
  try{const r=await fetch(q);if(!r.ok)throw 0;let d=await r.json();if(!Array.isArray(d))d=[d];
    // 保存を軽くするため、使う列だけ残す
    WX=d.map(x=>({hourly:x.hourly}));const t=Date.now();
    try{localStorage.setItem('osusume',JSON.stringify({k:key,t,d:WX}))}catch(e){}
    stamp(t,false)}catch(err){if(saved)stamp(saved.t,true);else $('stamp').textContent='電波がなく、予報を取れませんでした'}
  render();
}
render();load();
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{HERE={lat:p.coords.latitude,lon:p.coords.longitude};render()},()=>{},{maximumAge:6e5,timeout:1e4});
</script>
