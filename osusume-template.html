<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>つぎに登る山</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#1d2b2a;--sub:#5b6d6a;--line:#d5dfdc;--acc:#1f6f5c;
--ok:#2e8b57;--warn:#d98a00;--bad:#c8372d;--okbg:#e3f3ea;--warnbg:#fdf0d5;--badbg:#fbe1de}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;font-size:17px;line-height:1.5}
header{padding:12px 16px 6px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:18px 16px 6px;color:var(--sub)}
#stamp{font-size:14px;color:var(--sub)}
#stamp.off{color:var(--bad);font-weight:700}
nav{padding:0 16px 6px;font-size:15px}
a{color:var(--acc)}
#list{margin:8px 16px;display:flex;flex-direction:column;gap:8px}
.mt{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;text-decoration:none;display:block}
.mt.ok{border-left-color:var(--ok)}.mt.warn{border-left-color:var(--warn)}.mt.bad{border-left-color:var(--bad)}
.mt .ph{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:6px;background:var(--line)}
.mt .nm{font-weight:700;font-size:19px}
.mt .nm small{font-weight:400;color:var(--sub);font-size:14px}
.mt .best{font-weight:700;font-size:18px;margin:2px 0}
.mt.ok .best{color:#14532d}.mt.warn .best,.mt.bad .best{color:#7a4b00}
.mt .vals{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.mt .note{font-size:14px;color:var(--bad)}
.strip{display:flex;gap:2px;margin-top:6px}
.strip i{flex:1;height:22px;border-radius:4px;background:var(--line);font-style:normal;font-size:11px;text-align:center;line-height:22px;color:#fff}
.strip i.ok{background:var(--ok)}.strip i.warn{background:var(--warn)}.strip i.bad{background:var(--bad)}
.strip i.we{outline:2px solid var(--ink);outline-offset:-2px}
#done{margin:4px 16px 28px;font-size:14px;color:var(--sub);line-height:1.9}
#done span{display:inline-block;margin-right:10px;white-space:nowrap}
.legend{margin:0 16px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<header><h1>つぎに登る山</h1><div id="stamp">予報を取っています…</div></header>
<nav><a href="./">← 山の天気マップ</a></nav>
<p class="legend">帯は今日から16日ぶん。緑＝歩く時間ずっとおだやか。太枠は土日。山をさわると YAMAP が開きます。</p>
<div id="list"></div>
<h2>登った山</h2>
<div id="done"></div>
<script>
const M=/*DATA*/null, BUILT='<!--BUILT-->';
const $=id=>document.getElementById(id),WK='日月火水木金土',LV=['ok','warn','bad'];
const NEW=M.filter(m=>!m.climbed),DONE=M.filter(m=>m.climbed);
let WX=null,HERE=null;
const pad=n=>String(n).padStart(2,'0');

// 1時間の荒れ具合（天気マップと同じ基準）
function lvAt(w,k){const wind=Math.max(w.wind_speed_10m[k]??0,(w.wind_gusts_10m[k]??0)*.6),rain=w.precipitation[k]??0,code=w.weather_code[k]??0,feel=w.apparent_temperature[k];
  if(feel==null)return -1;return (wind>=15||rain>=5||code>=95)?2:(wind>=10||rain>=1||feel<=0)?1:0}

// 山ごとに16日ぶん: その日に歩き通せるか。日帰りは連続した好天枠、長いコースは日中まるごと×日数
function plan(m,w){
  const hrs=m.course.sec/3600,nd=w.time.length/24,multi=hrs>10,need=multi?Math.ceil(hrs/8):1,len=Math.ceil(hrs);
  const day=[],nowH=new Date().getHours()+1; // 今日は、もう過ぎた時刻から出発する案を出さない
  for(let d=0;d<nd;d++){let worst=-1,start=null;
    if(multi){if(d===0&&nowH>5){day.push({lv:-1,start:null});continue}for(let h=5;h<=15;h++)worst=Math.max(worst,lvAt(w,d*24+h))}
    else{let best=3;for(let s=d===0?Math.max(4,nowH):4;s+len<=18;s++){let x=-1;for(let h=s;h<s+len;h++)x=Math.max(x,lvAt(w,d*24+h));if(x>=0&&x<best){best=x;start=s}}worst=best===3?-1:best}
    day.push({lv:worst,start})}
  const lv=day.map((o,d)=>{if(!multi)return o.lv;let x=-1;for(let j=d;j<d+need;j++){if(j>=nd||day[j].lv<0)return -1;x=Math.max(x,day[j].lv)}return x});
  const first=lv.findIndex(x=>x===0);
  return{lv,day,first,multi,need,hrs}
}
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function hm(h){const H=Math.floor(h),m=Math.round((h-H)*60/10)*10;return m===60?(H+1)+'時間':H+'時間'+(m?m+'分':'')}

function render(){
  const today=new Date();today.setHours(0,0,0,0);const mon=today.getMonth();
  const rows=NEW.map((m,i)=>({m,p:WX&&WX[i]?plan(m,WX[i].hourly):null,d:HERE?km(HERE,m):null}));
  rows.sort((a,b)=>{const fa=a.p&&a.p.first>=0?a.p.first:99,fb=b.p&&b.p.first>=0?b.p.first:99;return fa-fb||(a.d??0)-(b.d??0)||a.m.course.sec-b.m.course.sec});
  $('list').innerHTML=rows.map(({m,p,d})=>{
    let best='予報を待っています',cls='',strip='';
    if(p){const f=p.first;
      if(f>=0){const t=new Date(+today+f*864e5),s=p.day[f].start;cls='ok';
        best=`${f===0?'今日':f===1?'あす':(t.getMonth()+1)+'/'+t.getDate()}（${WK[t.getDay()]}）`+(p.multi?`から${p.need}日間がよさそう`:`${s}時〜${s+Math.ceil(p.hrs)}時がよさそう`)}
      else{cls=p.lv.some(x=>x===1)?'warn':'bad';best='16日先まで、おだやかな日が見当たりません'}
      strip='<div class="strip">'+p.lv.map((x,j)=>{const t=new Date(+today+j*864e5),we=t.getDay()%6===0;return `<i class="${x>=0?LV[x]:''}${we?' we':''}">${t.getDate()}</i>`}).join('')+'</div>'}
    const c=m.course,quiet=m.season&&m.season[mon]<2;
    const far=d!=null?`　ここから約${Math.round(d)}km（車で${hm(d*1.4/45)}ほど・目安）`:'';
    return `<a class="mt ${cls}" href="https://yamap.com/mountains/${m.id}" target="_blank" rel="noopener">
      ${m.img?`<img class="ph" src="${m.img}" alt="" loading="lazy" width="540" height="360" onerror="this.remove()">`:''}
      <div class="nm">${m.name} <small>${m.alt}m　${m.pref.join('・')}</small></div>
      <div class="best">${best}</div>
      <div class="vals">${p&&p.multi?'⛺ ':''}歩く時間 ${hm(c.sec/3600)}　${c.km}km　登り${c.up}m${far}</div>
      <div class="vals">${c.name}</div>
      ${quiet?'<div class="note">この月に登る人は少ない山です（雪や通行止めに注意）</div>':''}${strip}</a>`}).join('');
  $('done').innerHTML=DONE.sort((a,b)=>b.climbed-a.climbed).map(m=>`<span>${m.name}${m.climbed>1?' ×'+m.climbed:''}</span>`).join('');
}
function stamp(t,off){const d=new Date(t);$('stamp').className=off?'off':'';
  $('stamp').textContent=(off?'電波なし。':'')+`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())} に取った予報`+(off?'を表示中':'')+`（山の一覧は ${BUILT} 更新）`}
async function load(){
  const key='osusume:'+NEW.map(m=>m.id).join(',');
  let saved=null;try{saved=JSON.parse(localStorage.getItem('osusume'));if(saved.k!==key)saved=null}catch(e){saved=null}
  if(saved){WX=saved.d;stamp(saved.t,false);render()}
  if(!NEW.length)return;
  const q='https://api.open-meteo.com/v1/forecast?latitude='+NEW.map(m=>m.lat)+'&longitude='+NEW.map(m=>m.lon)+'&elevation='+NEW.map(m=>m.alt)+
    '&hourly=apparent_temperature,weather_code,precipitation,wind_speed_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=16';
  try{const r=await fetch(q);if(!r.ok)throw 0;let d=await r.json();if(!Array.isArray(d))d=[d];
    // 保存を軽くするため、使う列だけ残す
    WX=d.map(x=>({hourly:x.hourly}));const t=Date.now();
    try{localStorage.setItem('osusume',JSON.stringify({k:key,t,d:WX}))}catch(e){}
    stamp(t,false)}catch(err){if(saved)stamp(saved.t,true);else $('stamp').textContent='電波がなく、予報を取れませんでした'}
  render();
}
render();load();
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{HERE={lat:p.coords.latitude,lon:p.coords.longitude};render()},()=>{},{maximumAge:6e5,timeout:1e4});
</script>
</body>
</html>
